[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "speckle-lejepa"
version = "0.1.0"
description = "LeJEPA pretraining modules for microscopy cell views"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.5", "torchvision>=0.20"]

[tool.setuptools.packages.find]
include = ["speckle_lejepa*"]
